<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fb8ea">
<title>Cricket Auction</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#edf2ec;--card:#ffffff;--card2:#f3f7f1;--ink:#10231a;--muted:#587064;--line:#d3dfd3;
  --turf:#1f8a57;--turf-ink:#ffffff;--brass:#a97800;--brass-bg:#f3d77a;--brass-ink:#241a00;--red:#c9372c;--ok:#1f8a57;
  --board:#0a1512;--board-ink:#f3f7ef;--board-line:#1f3d31;--b-brass:#ecc14f;--b-red:#ff5a4d;--b-muted:#8fb0a0;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07120e;--card:#0f221a;--card2:#0b1c15;--ink:#eef5ea;--muted:#8fab9d;--line:#1f3d31;
    --turf:#3fbf80;--turf-ink:#04130c;--brass:#ecc14f;--brass-bg:#ecc14f;--brass-ink:#241a00;--red:#ff6a5c;--ok:#3fbf80;
    --board:#040a08;--board-line:#1a3328;
  }
}
:root[data-theme="dark"]{
  --bg:#07120e;--card:#0f221a;--card2:#0b1c15;--ink:#eef5ea;--muted:#8fab9d;--line:#1f3d31;
  --turf:#3fbf80;--turf-ink:#04130c;--brass:#ecc14f;--brass-bg:#ecc14f;--brass-ink:#241a00;--red:#ff6a5c;--ok:#3fbf80;
  --board:#040a08;--board-line:#1a3328;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--ui);min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.shell{max-width:520px;margin:0 auto;padding:0 14px 110px}
.muted{color:var(--muted)}
.center{text-align:center}
small{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{font:800 26px/1 var(--disp);letter-spacing:.2px;margin-bottom:10px}
.card h3{font:700 15px/1.2 var(--ui);margin:0 0 8px}
.note{border-radius:12px;padding:10px 12px;margin:12px 0;background:var(--card2);border:1px solid var(--line);font-size:14px}
.note.warn{border-color:var(--red);color:var(--ink)}
.note.good{border-color:var(--ok)}
/* buttons */
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;width:100%}
.btn.pri{background:var(--turf);color:var(--turf-ink);border-color:transparent}
.btn.gold{background:var(--brass-bg);color:var(--brass-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;width:auto;padding:0 12px;font-size:14px;border-radius:10px}
.btn.big{min-height:60px;font-size:20px}
.btn:disabled{opacity:.45}
.btn.danger{color:var(--red);border-color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{display:block}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:8px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--turf);outline-offset:1px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline>*{min-width:0}
/* home */
.brand{padding:22px 4px 6px}
.brand h1{font:900 56px/.9 var(--disp);letter-spacing:.5px}
.brand p{margin-top:10px;color:var(--muted);max-width:30ch}
.stump{display:flex;gap:5px;margin-bottom:12px}
.stump i{width:7px;height:34px;border-radius:3px;background:var(--brass-bg)}
.stump i:nth-child(2){height:40px}
/* steppers, seg */
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:20px;font-weight:700}
.step button:disabled{opacity:.35}
.step span{min-width:54px;text-align:center;font:800 24px var(--disp)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:42px;border:0;background:var(--card2);font-weight:600;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--turf);color:var(--turf-ink)}
/* room code */
.code{font:900 54px/1 var(--disp);letter-spacing:6px;text-align:center;color:var(--brass);padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip button{border:0;background:none;color:var(--muted);font-size:16px;padding:0 0 0 2px}
.plist .prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.plist .prow:first-child{border-top:0}
.plist .prow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .prow em{font:800 20px var(--disp);font-style:normal;color:var(--brass)}
.plist .prow button{border:0;background:none;color:var(--muted);font-size:20px;width:34px;height:34px}
.issues{margin:0 0 10px;padding-left:18px;color:var(--red);font-size:14px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;background:var(--bg)}
.top b{font:800 22px/1 var(--disp)}
.top small{display:block;margin-top:2px}
.purse{text-align:right}
.purse b{color:var(--brass);font-size:30px}
/* lot scoreboard */
.lot{position:relative;overflow:hidden;border-radius:20px;padding:16px 16px 14px;margin:6px 0 12px;color:var(--board-ink);
  background:radial-gradient(120% 70% at 50% -15%,rgba(255,240,190,.26),transparent 62%),linear-gradient(180deg,#0e2019,var(--board));
  border:1px solid var(--board-line)}
.lot.extra{border-color:var(--b-red);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,90,77,.35)}}
.lotno{font-size:13px;color:var(--b-muted);display:flex;justify-content:space-between}
.pname{font:900 clamp(40px,13vw,58px)/.95 var(--disp);margin:8px 0 4px;word-break:break-word}
.base{color:var(--b-muted);font-size:14px}
.scoreboard{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.scoreboard small{color:var(--b-muted)}
.price{font:900 92px/.85 var(--disp);color:var(--b-brass);display:flex;align-items:baseline;gap:4px}
.price i{font:700 24px var(--disp);font-style:normal;color:var(--b-muted)}
.clock{text-align:right}
#cd{font:900 62px/.9 var(--disp)}
.lot.extra #cd,.lot.extra #cl{color:var(--b-red)}
.segbar{height:12px;margin:12px 0 8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 8px,transparent 8px 11px)}
#bar{height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--b-brass) 0 8px,transparent 8px 11px);transition:width .18s linear}
.lot.extra #bar{background:repeating-linear-gradient(90deg,var(--b-red) 0 8px,transparent 8px 11px)}
.leader{font-size:15px;min-height:22px}
.leader b{color:var(--b-brass)}
.stamp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  background:rgba(4,10,8,.86);animation:slam .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{from{transform:scale(1.5);opacity:0}to{transform:none;opacity:1}}
.stamp .big{font:900 74px/.9 var(--disp);color:var(--b-brass);transform:rotate(-4deg);border:5px solid var(--b-brass);padding:2px 18px;border-radius:8px}
.stamp.un .big{color:var(--b-muted);border-color:var(--b-muted)}
.stamp p{font-size:18px;font-weight:700;margin-top:12px}
.stamp small{color:var(--b-muted)}
/* bids */
.bids{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0 6px}
.bidbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:4px 0}
.bidbtn b{font:900 28px/1 var(--disp)}
.bidbtn span{font-size:12px;color:var(--muted)}
.bidbtn:not(:disabled){background:var(--brass-bg);border-color:transparent;color:var(--brass-ink)}
.bidbtn:not(:disabled) span{color:var(--brass-ink);opacity:.8}
.bidbtn:disabled{opacity:.4}
.bidbtn:not(:disabled):active{transform:translateY(1px)}
.hostbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.hostbar .btn{min-height:44px;padding:0 4px;font-size:13px}
.recent{font-size:14px;color:var(--muted)}
.recent div{padding:6px 0;border-top:1px solid var(--line)}
.recent b{color:var(--ink)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:170px;min-height:50px;border-radius:12px;border:0;background:transparent;font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tabs button span{font-size:18px}
.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--brass)}
/* squad / xi */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{min-width:0}
.col h3{display:flex;justify-content:space-between;align-items:baseline}
.col h3 small{font-weight:500}
.srow,.slot .sl{display:flex;align-items:center;gap:6px;width:100%;min-height:46px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-align:left;margin-bottom:6px}
.srow i,.slot .sl i{font:800 15px var(--disp);font-style:normal;color:var(--muted);min-width:18px}
.srow span,.slot .sl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.srow em{font-style:normal;font-size:12px;color:var(--brass);font-weight:700}
.srow.used{opacity:.55}
.srow.used em::after{content:' XI'}
.srow.sel,.slot.sel .sl{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset;background:var(--card2)}
.slot{display:flex;gap:4px;margin-bottom:6px}
.slot .sl{margin:0;flex:1}
.slot .sl.empty span{color:var(--muted);font-weight:500}
.slot .x{width:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions .btn{flex:1}
/* board */
.trow{border-top:1px solid var(--line);padding:10px 0}
.trow:first-child{border-top:0}
.thead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:0}
.thead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead em{font:800 20px var(--disp);font-style:normal;color:var(--brass)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.badge.bad{color:var(--red);border-color:var(--red)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.tsq{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.tsq b{color:var(--ink);font-weight:600}
.pool .prow{display:flex;gap:8px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.pool .prow:first-child{border-top:0}
.pool .prow span:last-child{color:var(--muted);text-align:right}
/* judging / results */
.jcard{text-align:center;padding:18px 14px}
.jcard .jt{font:800 22px var(--disp);color:var(--muted)}
.jcard .jn{font:900 clamp(38px,12vw,54px)/1 var(--disp);margin:6px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.y{background:var(--brass-bg);border-color:var(--brass-bg)}
.dots i.n{background:var(--line)}
.dots i.now{border-color:var(--brass)}
.two-btn{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.win{text-align:center;padding:22px 14px;background:linear-gradient(180deg,var(--brass-bg),transparent 140%);border-color:var(--brass)}
.win .t{font:900 44px/1 var(--disp);color:var(--brass-ink)}
.win p{color:var(--brass-ink)}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{font:900 24px var(--disp);width:26px;color:var(--muted)}
.rank b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank em{font:900 26px var(--disp);font-style:normal;color:var(--brass)}
.xilist{font-size:14px;margin:6px 0 0;padding-left:0;list-style:none}
.xilist li{display:flex;justify-content:space-between;padding:3px 0}
.xilist .y{color:var(--ok);font-weight:700}
.xilist .n{color:var(--muted)}
#toast{position:fixed;left:50%;transform:translate(-50%,-20px);top:calc(12px + env(safe-area-inset-top,0px));z-index:50;max-width:92vw;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.lot.extra{animation:none}.stamp{animation:none}#bar{transition:none}}

/* ===== Sky and Night themes ===== */
:root[data-theme="sky"],:root[data-theme="night"]{--disp:'Fraunces',Georgia,'Times New Roman',serif}
:root[data-theme="sky"]{--sky:linear-gradient(#7fb8ea 0%,#bfdcf3 38%,#e4f0f6 62%,#cfe6d2 100%);--bg:#cfe3f3;--card:rgba(255,255,255,.76);--card2:rgba(255,255,255,.55);--ink:#10263d;--muted:#4f6b85;--line:rgba(255,255,255,.8);--turf:#2f8f93;--turf-ink:#fff;--brass:#9a7222;--brass-bg:#e8c978;--brass-ink:#2a1f05;--red:#c7352b;--ok:#1d7f55;--board:#fff;--board-line:rgba(255,255,255,.85);--board-ink:#10263d;--b-brass:#9a7222;--b-red:#d1392d;--b-muted:#4f6b85;--lotbg:rgba(255,255,255,.82);--stampbg:rgba(255,255,255,.92);--seg:rgba(16,38,61,.13);--topbg:rgba(207,227,243,.88);--cloud:#fff;--grass:#5fa35a;--pitch:#d8b77a;--figure:#1f4f86;--stars:0}
:root[data-theme="night"]{--sky:linear-gradient(#08122b 0%,#14284f 45%,#223f6c 75%,#2c4a72 100%);--bg:#0e1b38;--card:rgba(18,34,66,.74);--card2:rgba(30,52,92,.6);--ink:#eaf1fb;--muted:#9bb3d1;--line:rgba(255,255,255,.14);--turf:#3aa6aa;--turf-ink:#041516;--brass:#e6c36a;--brass-bg:#e6c36a;--brass-ink:#2a1f05;--red:#ff7a6c;--ok:#4fd19b;--board:#0b1630;--board-line:rgba(255,255,255,.14);--board-ink:#eaf1fb;--b-brass:#e6c36a;--b-red:#ff7a6c;--b-muted:#9bb3d1;--lotbg:rgba(14,28,56,.8);--stampbg:rgba(8,18,40,.92);--seg:rgba(255,255,255,.14);--topbg:rgba(10,22,46,.88);--cloud:#9bb3d1;--grass:#14342a;--pitch:#5b4a30;--figure:#8fb4e6;--stars:.9}
body{background:var(--sky) fixed;color:var(--ink)}
#scene{position:fixed;inset:0;z-index:-1;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
#scene .cl ellipse{fill:var(--cloud);opacity:.55}
#scene .gr{fill:var(--grass)}#scene .pi{fill:var(--pitch)}#scene .cr{stroke:#fff;stroke-width:3;opacity:.8}
#scene .fg path{stroke:var(--figure);fill:none;stroke-linecap:round;opacity:.8}#scene .fg .h{fill:var(--figure);opacity:.8}
#scene .st circle{fill:#fff;opacity:var(--stars)}
.card,.tabs,.top,.sheet,.startbar{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card{border-radius:22px;box-shadow:0 10px 30px rgba(15,50,100,.12)}
.card h2,.pname,.jn,.jcard .jt,.win .t,.brand h1,.stamp .big,.price,#cd,.xiclock b,.code,.sheet h3{font-family:var(--disp);font-weight:600}
.card h2::after{content:"";display:block;width:30px;height:2px;background:var(--brass);margin-top:8px}
.card h2 small{font-family:var(--ui)}.card h2 i{font-style:italic;font-weight:500}
.lot{background:var(--lotbg);border-color:var(--board-line);box-shadow:0 10px 30px rgba(15,50,100,.14)}
.price{font-size:84px}
.segbar{background:repeating-linear-gradient(90deg,var(--seg) 0 8px,transparent 8px 11px)}
.stamp{background:var(--stampbg)}
.top{display:block;background:var(--topbg);margin:0 -14px 6px;padding:8px 14px 6px}
.trow1,.trow2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.trow2{margin-top:4px}
.wrap.home>.trow1{padding-top:10px}
.kicker{font:700 12px var(--ui);letter-spacing:.22em;color:var(--brass);display:flex;align-items:center;gap:8px}
.kicker::before{content:"";width:22px;height:2px;background:var(--brass)}
.tools{display:flex;gap:6px}
.tools button{min-width:38px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;padding:0 10px}
.tools .lv{font-weight:700;font-size:13px}
.wrap.lobbyhost{padding-bottom:140px}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--topbg);border-top:1px solid var(--line)}
.startbar .issue{display:block;color:var(--red);margin:0 0 6px;font-size:13px}
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 10px;padding:2px 14px 6px}
.tm{flex:none;min-width:132px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tm.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.tm b{display:flex;align-items:center;gap:6px;white-space:nowrap}
.shade{position:fixed;inset:0;background:rgba(5,15,30,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:22px;margin:0}
.xiclock{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin:12px 0;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.xiclock b{font-size:40px;color:var(--brass)}
.btn.pri{box-shadow:0 6px 16px rgba(47,143,147,.28)}

/* ===== v2: roles, colours, chat, profile, championship, intro ===== */

(function(){

async function makeProfile(name){

    if (s.exists) continue;
    const rec = genCode(), p = { pid, owner:S.uid, name, games:0, wins:0, hostN:0, judgeN:0, invN:0, champs:0, champWins:0, createdAt:Date.now() };
    await S.db.doc('vault/' + pid).set({ rec, owner:S.uid });

async function loadProfile(){

      const s = await S.db.doc('profiles/' + pid).get();
      if (s.exists){
        S.profile = s.data();

async function recoverProfile(pid, rec, quiet){
  pid = String(pid || '').trim().toUpperCase(); rec = String(rec || '').trim().toUpperCase();
  if (!pid || !rec) return toast('Type your Player ID and recovery code.');
  try{
    const s = await S.db.doc('profiles/' + pid).get();
    if (!s.exists) return toast('No profile with that Player ID.');
    const p = s.data();
    if (p.owner !== S.uid){
      await S.db.doc('profiles/' + pid).update({ owner:S.uid, claim:rec });
      const clean = Object.assign({}, p, { owner:S.uid }); delete clean.claim;
      await S.db.doc('profiles/' + pid).set(clean); S.profile = clean;
    } else S.profile = p;
    ls.set('ca:pid', pid); ls.set('ca:rec', rec); S.form.recOpen = false;
    if (!quiet) toast('Profile restored: ' + S.profile.name);
    rerender(true);
  }catch(e){ if (!quiet) toast('That recovery code did not work.'); console.error(e); }
}

function countStats(){
  const r = S.room, L = r && r.last, p = S.profile; if (!L || !p || p.owner !== S.uid || !S.db) return;
  const key = S.code + ':' + (r.createdAt || 0) + ':' + L.game;
  if (!S.counted[key] && !ls.get('ca:cnt:' + key)){
    const iHost = r.hostId === S.uid, row = L.rows.find(x => x.uid === S.uid), iJudge = !!L.judge && L.judge === S.uid;
    S.counted[key] = 1;
    if (iHost || row || iJudge){
      ls.set('ca:cnt:' + key, '1');
      const n = clone(S.profile); n.games++; if (row && L.winners.includes(S.uid)) n.wins++; if (iHost) n.hostN++; if (iJudge) n.judgeN++;
      n.invN += S.members.filter(m => m.invBy && m.invBy === p.pid && m.uid !== S.uid).length;
      saveProfile(n);

  const ch = r.champ, ck = 'C' + S.code + ':' + (r.createdAt || 0);
  if (ch && ch.done && !S.counted[ck] && !ls.get('ca:cnt:' + ck)){

    case 'copypid': if (S.profile){ if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(S.profile.pid).then(() => toast('Player ID copied'), () => toast(S.profile.pid)); else toast(S.profile.pid); } return;
    case 'savename': { const nm = (S.form.profname || '').trim().slice(0, 20); if (!S.profile || S.profile.owner !== S.uid) return toast('Restore your profile first.'); if (!nm) return toast('Type a display name.'); const n = clone(S.profile); n.name = nm; saveProfile(n); S.form.profname = null; toast('Name saved'); return rerender(true); }
    case 'togrec': S.form.recOpen = !S.form.recOpen; return rerender(true);
    case 'restore': return recoverProfile(S.form.rpid, S.form.rrec);
    case 'coltog': S.colorOpen = !S.colorOpen; return rerender();
    case 'color': { const m = me(); if (!m) return; m.color = d.c; _cmFor = null; memberRef(S.uid).update({ color:d.c }).catch(onErr); return rerender(true); }
    case 'retain': { const m = me(); if (!m) return; const v = m.retain === d.pid ? null : d.pid; m.retain = v; memberRef(S.uid).update({ retain:v }).catch(onErr); return rerender(true); }
    case 'chat': S.chatOpen = true; S.chatSeen = S.chat.length ? S.chat[S.chat.length - 1].at : 0; S.chatUnread = 0; renderChat(); { const i = CH.querySelector('#ci'); if (i) i.focus(); } return rerender();
    case 'chatx': S.chatOpen = false; CH.innerHTML = ''; return rerender();
    case 'chatsend': return sendChat();
    case 'jgive': if (amJudge() || host) judgeStep(true); return;
    case 'jskip': if (amJudge() || host) judgeStep(false); return;
    case 'jundo': if (amJudge() || host) judgeUndo(); return;
  }
  if (isAuctioneer()) switch (a){
    case 'pause': return hostPause();
    case 'hammer': if (S.state.phase === 'bidding' && S.state.cur.leader) resolve(false); return;
    case 'skip': if (S.state.phase === 'bidding') resolve(true); return;
    case 'endask': S.endAsk = true; rerender(); setTimeout(() => { S.endAsk = false; rerender(); }, 4000); return;
    case 'endyes': S.endAsk = false; return hostEnd();
    case 'startj': return startJudging();
    case 'finish': return finishNoJudge();
    case 'handask': S.handOpen = !S.handOpen; return rerender();
    case 'handto': { const r = clone(S.room); r.auctioneer = d.u; r.handoverAt = Date.now(); S.handOpen = false; S.hbAt = performance.now(); commitRoom(r); return toast('Clock handed over.'); }
  }
  if (!host) return;
  switch (a){
    case 'takeback': { const r = clone(S.room); r.auctioneer = S.uid; r.handoverAt = Date.now(); S.runnerSync = false; return commitRoom(r); }
    case 'mode': {
      const r = clone(S.room), c = r.cfg; if (d.m === 'nojudge' && r.champ) return toast('A championship needs a winner each game.');
      c.mode = d.m;
      if (d.m === 'judge'){ if (c.judgeMode === 'none') c.judgeMode = 'friend'; if (c.judgeMode === 'friend' && !S.judgeDoc) c.judgeId = null; }
      else { c.judgeMode = 'none'; c.judgeId = null; }
      return commitRoom(r);
    }
    case 'mystery': { const r = clone(S.room); r.cfg.mystery = r.cfg.mystery === false; return commitRoom(r); }
    case 'champ': {
      if (gameNo() !== 1) return; const r = clone(S.room);
      if (r.champ) r.champ = null; else { r.champ = newChamp(3); if (r.cfg.mode === 'nojudge'){ r.cfg.mode = 'points'; r.cfg.judgeMode = 'none'; r.cfg.judgeId = null; } }
      return commitRoom(r);
    }
    case 'cgames': { if (!champ() || gameNo() !== 1) return; const r = clone(S.room); r.champ.total = Math.min(7, Math.max(2, r.champ.total + (+d.d))); return commitRoom(r); }
    case 'newgame': {
      const r = clone(S.room), ch = r.champ; if (!ch || !r.last || ch.done) return;
      r.game = gameNo() + 1; ch.game = r.game; r.status = 'lobby'; r.last = null; r.players = []; r.auctioneer = r.hostId; S.recLabel = null;
      return commitRoom(r);
    }
    case 'reuselist': { const r = clone(S.room); r.players = (r.prevPlayers || []).map(p => ({ id:uid8(), name:p.name, base:p.base, role:p.role || 'AR', pts:p.pts || 5 })); return commitRoom(r); }
    case 'cycrole': { const r = clone(S.room), p = r.players.find(x => x.id === d.id); if (!p) return; p.role = ROLE_ORDER[(ROLE_ORDER.indexOf(p.role || 'AR') + 1) % 3]; return commitRoom(r); }
    case 'pts': { const r = clone(S.room), p = r.players.find(x => x.id === d.id); if (!p) return; p.pts = Math.min(10, Math.max(1, (p.pts || 5) + (+d.d))); return commitRoom(r); }
    case 'prole': S.form.prole = d.r; return rerender(true);
    case 'hrole': {
      const r = clone(S.room), c = r.cfg;
      if (d.r === 'judge'){ c.judgeMode = 'host'; S.form.wantPlay = false; if (me()) memberRef(S.uid).delete().catch(onErr); }
      else { if (c.judgeMode === 'host') c.judgeMode = 'friend'; S.form.wantPlay = d.r === 'play'; if (d.r !== 'play' && me()) memberRef(S.uid).delete().catch(onErr); }
      return commitRoom(r);
    }
    case 'cfg': {
      const k = d.k, r = clone(S.room), c = r.cfg, l = LIM[k]; if (!l) return;
      c[k] = Math.min(l[1], Math.max(l[0], (c[k] || 60) + (+d.d) * (k === 'xiSec' ? 15 : 1)));
      if (k === 'minSquad' && c.maxSquad < c.minSquad) c.maxSquad = c.minSquad;
      if (k === 'maxSquad' && c.minSquad > c.maxSquad) c.minSquad = c.maxSquad;
      return commitRoom(r);
    }
    case 'jmode': {
      const r = clone(S.room), c = r.cfg; c.judgeMode = d.m;
      if (d.m === 'host') c.judgeId = S.uid; else if (d.m === 'none') c.judgeId = null; else if (!S.members.some(m => m.uid === c.judgeId)) c.judgeId = null;
      return commitRoom(r);
    }
    case 'jpick': { const r = clone(S.room); r.cfg.judgeId = d.u; return commitRoom(r); }
    case 'jtake': { const r = clone(S.room); r.cfg.judgeMode = 'host'; r.cfg.judgeId = S.uid; return commitRoom(r); }
    case 'kick': return void S.db.doc('rooms/' + S.code + '/members/' + d.u).delete().then(() => rerender(true)).catch(onErr);
    case 'hostplay': {
      const team = (S.form.hostteam || '').trim().slice(0, 20); if (!team) return toast('Type a team name first.');
      if (S.members.length >= cfg().maxTeams) return toast('Raise the team limit first.');
      return void memberRef(S.uid).set({ uid:S.uid, team, joinedAt:Date.now(), xi:[], locked:false, pid:S.profile ? S.profile.pid : null, invBy:null, color:null, retain:null }).then(() => rerender(true)).catch(onErr);
    }
    case 'addp': {
      const name = (S.form.pname || '').trim(); if (!name) return toast('Type a player name.');
      const base = Math.max(1, Math.min(100, parseInt(S.form.pbase, 10) || 1));
      const r = clone(S.room); if (r.players.length >= 100) return toast('Limit is 100 players.');
      r.players.push({ id:uid8(), name:name.slice(0, 28), base, role:S.form.prole || 'AR', pts:Math.max(1, Math.min(10, parseInt(S.form.ppts, 10) || 5)) });
      S.form.pname = ''; S.form.pbase = ''; S.form.ppts = ''; S.focusSel = '#np-name'; return commitRoom(r);
    }
    case 'togglebulk': S.form.bulkOpen = !S.form.bulkOpen; return rerender(true);
    case 'bulk': {
      const { out, bad } = parseList(S.form.bulk || ''); if (!out.length) return toast('No valid lines. Try "Kohli 5cr".');
      const r = clone(S.room); r.players = r.players.concat(out).slice(0, 100);
      S.form.bulk = bad.join('\n'); if (!bad.length) S.form.bulkOpen = false;
      toast(out.length + ' added' + (bad.length ? ', ' + bad.length + ' line(s) skipped' : ''));
      return commitRoom(r);
    }
    case 'sample': { const r = clone(S.room); r.players = r.players.concat(parseList(SAMPLE).out).slice(0, 100); return commitRoom(r); }
    case 'delp': { const r = clone(S.room); r.players = r.players.filter(p => p.id !== d.id); return commitRoom(r); }
    case 'clearp': { const r = clone(S.room); r.players = []; return commitRoom(r); }
    case 'start': return hostStart();
    case 'closeask': S.closeAsk = true; rerender(); setTimeout(() => { S.closeAsk = false; rerender(); }, 4000); return;
    case 'closeyes': return closeRoom();
  }
}

async function init(){
  render();
  try{ if (claudeApi && claudeApi.use){ S.db = await claudeApi.use('db'); S.user = await claudeApi.use('user'); } }catch(e){ console.error(e); }
  S.connecting = false;
  if (S.user){
    try{ S.uid = await S.user.id(); }catch(e){}
    try{ S.canWrite = await S.user.can('data.write'); }catch(e){}
  }
  if (!S.uid){ let a = ls.get(LS + ':anon'); if (!a){ a = 'anon_' + uid8(); ls.set(LS + ':anon', a); } S.uid = a; }
  await loadProfile();
  if (S.db && ls.get(LS)) await resume(); else rerender(true);
}
init();
return { S, act, parseList, destroy(){ clearInterval(loop); leaveRoom(true); } };
}
window.CricketAuction = { createApp };
})();

/* ---------- Firebase boot: setup screen, anonymous sign-in, then start the game ---------- */
(function(){
'use strict';
if (window.__NO_AUTOSTART) return;
const KEY = 'cricket-auction:fbcfg';
const root = document.getElementById('app');
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
document.documentElement.setAttribute('data-theme', lsGet('ca:theme') || 'sky');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEYS = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
function parseCfg(text){
  const cfg = {}, re = /["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"']+)["']/g;
  let m; while ((m = re.exec(String(text)))) cfg[m[1]] = m[2];
  return cfg;
}
const validCfg = c => !!(c && c.apiKey && c.projectId && c.appId);
const slim = c => { const o = {}; KEYS.forEach(k => { if (c[k]) o[k] = c[k]; }); return o; };
function readHash(){
  const out = {}, h = location.hash.replace(/^#/, ''); if (!h) return out;
  const p = new URLSearchParams(h);
  if (p.get('fb')){ try{ out.cfg = JSON.parse(atob(p.get('fb'))); }catch(e){} }
  if (p.get('room')) out.room = p.get('room').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  if (p.get('inv')) out.inv = p.get('inv').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 9);
  return out;
}
function page(inner){ root.innerHTML = '<div class="wrap home">' + inner + '</div>'; }
function brand(title, text){ return '<div class="brand"><div class="stump"><i></i><i></i><i></i></div><h1>' + title + '</h1>' + (text ? '<p>' + text + '</p>' : '') + '</div>'; }

function showSetup(msg){
  page(brand('One-time<br>setup', 'Paste the Firebase web config for your project. You do this once. Then you can send friends an invite link that carries it for them.') +
    '<section class="card"><label for="cfg">Firebase web config</label><textarea id="cfg" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;...&quot;,&#10;  projectId: &quot;...&quot;,&#10;  appId: &quot;...&quot;&#10;};"></textarea>' +
    (msg ? '<div class="note warn">' + esc(msg) + '</div>' : '') +
    '<div style="height:12px"></div><button class="btn pri" id="cfgsave">Save and start</button></section>');
  root.querySelector('#cfgsave').addEventListener('click', () => {
    const cfg = parseCfg(root.querySelector('#cfg').value);
    if (!validCfg(cfg)) return showSetup('That config is missing apiKey, projectId or appId. Copy the whole block from Project settings, Your apps.');
    lsSet(KEY, JSON.stringify(slim(cfg))); start(slim(cfg), null, null);
  });
}
function fail(msg){
  page(brand('Cannot<br>connect', '') + '<section class="card"><div class="note warn">' + esc(msg) + '</div>' +
    '<button class="btn pri" id="retry">Try again</button><div style="height:8px"></div><button class="btn" id="reset">Change Firebase project</button></section>');
  root.querySelector('#retry').addEventListener('click', () => location.reload());
  root.querySelector('#reset').addEventListener('click', () => { lsDel(KEY); location.reload(); });
}
function explain(e){
  const c = (e && e.code) || '';
  if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'Anonymous sign-in is switched off. In Firebase open Authentication, Sign-in method, turn on Anonymous, then try again.';
  if (c === 'auth/configuration-not-found') return 'Authentication is not set up yet. In Firebase open Authentication and tap Get started, then turn on Anonymous.';
  if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return 'That API key is not valid. Check the config you pasted.';
  if (c === 'auth/unauthorized-domain') return "This website is not allowed yet. In Firebase open Authentication, Settings, Authorized domains, and add this site's domain.";
  if (c === 'auth/network-request-failed' || c === 'unavailable') return 'No connection to Firebase. Check your internet and try again.';
  if (c === 'permission-denied') return 'Firestore is blocking access. Paste the security rules from the setup guide and tap Publish.';
  if (c === 'not-found' || c === 'failed-precondition') return 'The Firestore database does not exist yet. In Firebase open Firestore Database and tap Create database.';
  return 'Something went wrong: ' + (c || (e && e.message) || 'unknown error');
}
async function start(cfg, room, inv){
  page(brand('Connecting', 'Signing in to your game server.'));
  if (!window.firebase) return fail('Could not load Firebase from the internet. Check your connection and reload.');
  let db, uid;
  try{
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const existing = await new Promise(res => { const un = auth.onAuthStateChanged(u => { un(); res(u); }); });
    uid = existing ? existing.uid : (await auth.signInAnonymously()).user.uid;
    db = firebase.firestore();
    try{ db.settings({ experimentalAutoDetectLongPolling:true, merge:true }); }catch(e){}
    await db.doc('rooms/_probe').get();
  }catch(e){ console.error(e); return fail(explain(e)); }
  const shim = { use: async n => n === 'db' ? db : n === 'user' ? { id: async () => uid, can: async () => true, isOwner: async () => false, canEdit: async () => false } : null };
  root.innerHTML = '';
  window.CricketAuction.createApp(root, shim, {
    lsKey: 'cricket-auction:' + cfg.projectId, prefillCode: room, prefillInv: inv,
    onReset(){ lsDel(KEY); location.reload(); },
    inviteUrl(code, pid){ return location.href.split('#')[0] + '#fb=' + encodeURIComponent(btoa(JSON.stringify(slim(cfg)))) + '&room=' + code + (pid ? '&inv=' + pid : ''); }
  });
}
const hash = readHash();
let cfg = null;
if (hash.cfg && validCfg(hash.cfg)){ cfg = slim(hash.cfg); lsSet(KEY, JSON.stringify(cfg)); }
else { try{ const s = lsGet(KEY); if (s) cfg = JSON.parse(s); }catch(e){} }
if (hash.cfg || hash.room || hash.inv){ try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} }
if (!validCfg(cfg)) showSetup(); else start(cfg, hash.room || null, hash.inv || null);
})();
</script>
